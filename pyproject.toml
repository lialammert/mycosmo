[project]
name = "mycosmo"
version = "0.1.0"
description = "This is an example cosmology package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-emoji>=0.2.0",
]

[tool.pytest.ini_options]
addopts = ["--verbose", "--emoji", "--cov=mycosmo"]
testpaths = ["tests"]

